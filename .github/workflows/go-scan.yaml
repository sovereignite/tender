name: Go Scan

on:
  workflow_call:
    inputs:
      target-id:
        description: 'Stable logical target id used in artifact names'
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Scan"
        uses: ./.github/actions/go-scan
        with:
          target-id: ${{ inputs.target-id }}
