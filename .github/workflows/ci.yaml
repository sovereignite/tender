name: Continuous integration

on:
  push:
    branches: [master, 'feature/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/feature/') }}

permissions:
  contents: read

jobs:
  changes:
    name: Discover changes
    runs-on: self-hosted
    outputs:
      files: ${{ steps.changes.outputs.files }}
      all: ${{ steps.changes.outputs.all }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover changes
        id: changes
        uses: ./.github/actions/changes
        with:
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          branch: ${{ github.event.repository.default_branch }}
          compare: ${{ github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch }}

  commands:
    name: Discover commands
    needs: changes
    runs-on: self-hosted
    outputs:
      commands: ${{ steps.commands.outputs.commands }}
      found: ${{ steps.commands.outputs.found }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Discover commands
        id: commands
        uses: ./.github/actions/commands
        with:
          files: ${{ needs.changes.outputs.files }}
          all: ${{ needs.changes.outputs.all }}

  lint:
    name: Lint ${{ matrix.command }}
    if: needs.commands.outputs.found == 'true'
    needs: commands
    runs-on: self-hosted
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.commands.outputs.commands) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint
        uses: ./.github/actions/lint
        with:
          path: ./cmd/${{ matrix.command }}/...

  test:
    name: Test ${{ matrix.command }}
    if: needs.commands.outputs.found == 'true'
    needs: [commands, lint]
    runs-on: self-hosted
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.commands.outputs.commands) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test
        uses: ./.github/actions/test
        with:
          path: ./cmd/${{ matrix.command }}/...
          report: "${{ matrix.command }} tests"

  quality:
    name: Quality gate
    if: always()
    needs: [commands, lint, test]
    runs-on: self-hosted
    steps:
      - name: Check quality
        if: >-
          ${{
            needs.commands.result != 'success' ||
            (needs.commands.outputs.found == 'true' && needs.lint.result != 'success') ||
            (needs.commands.outputs.found == 'true' && needs.test.result != 'success')
          }}
        run: exit 1

  build:
    name: Build ${{ matrix.command }}
    if: needs.commands.outputs.found == 'true'
    needs: [quality, commands]
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.commands.outputs.commands) }}
    uses: ./.github/workflows/build.yaml
    with:
      path: ./cmd/${{ matrix.command }}
      name: ${{ matrix.command }}

  built:
    name: Build gate
    if: always()
    needs: [commands, build]
    runs-on: self-hosted
    steps:
      - name: Check builds
        if: >-
          ${{
            needs.commands.result != 'success' ||
            (needs.commands.outputs.found == 'true' && needs.build.result != 'success')
          }}
        run: exit 1

  scan:
    name: Scan ${{ matrix.command }}
    if: needs.commands.outputs.found == 'true'
    needs: [built, commands]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.commands.outputs.commands) }}
    uses: ./.github/workflows/scan.yaml
    with:
      name: ${{ matrix.command }}

  scanned:
    name: Scan gate
    if: always()
    needs: [commands, scan]
    runs-on: self-hosted
    steps:
      - name: Check scans
        if: >-
          ${{
            needs.commands.result != 'success' ||
            (needs.commands.outputs.found == 'true' && needs.scan.result != 'success')
          }}
        run: exit 1

  sign:
    name: Sign ${{ matrix.command }}
    if: needs.commands.outputs.found == 'true'
    needs: [scanned, commands]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.commands.outputs.commands) }}
    uses: ./.github/workflows/sign.yaml
    with:
      name: ${{ matrix.command }}

  signed:
    name: Sign gate
    if: always()
    needs: [commands, sign]
    runs-on: self-hosted
    steps:
      - name: Check signatures
        if: >-
          ${{
            needs.commands.result != 'success' ||
            (needs.commands.outputs.found == 'true' && needs.sign.result != 'success')
          }}
        run: exit 1

  attest:
    name: Attest ${{ matrix.command }}
    if: needs.commands.outputs.found == 'true'
    needs: [signed, commands]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.commands.outputs.commands) }}
    uses: ./.github/workflows/attest.yaml
    with:
      name: ${{ matrix.command }}

  attested:
    name: Attestation gate
    if: always()
    needs: [commands, attest]
    runs-on: self-hosted
    steps:
      - name: Check attestations
        if: >-
          ${{
            needs.commands.result != 'success' ||
            (needs.commands.outputs.found == 'true' && needs.attest.result != 'success')
          }}
        run: exit 1

  release:
    name: Create release
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    needs: attested
    permissions:
      contents: write
    runs-on: self-hosted
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

  publish:
    name: Publish ${{ matrix.command }}
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.commands.outputs.found == 'true' }}
    needs: [commands, release]
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.commands.outputs.commands) }}
    uses: ./.github/workflows/publish.yaml
    with:
      name: ${{ matrix.command }}

  published:
    name: Publish gate
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [commands, release, publish]
    runs-on: self-hosted
    steps:
      - name: Check release assets
        if: >-
          ${{
            needs.release.result != 'success' ||
            (needs.commands.outputs.found == 'true' && needs.publish.result != 'success')
          }}
        run: exit 1
