name: Sign

on:
  workflow_call:
    inputs:
      name:
        description: Command name
        required: true
        type: string
      os:
        description: Target operating system
        required: false
        type: string
        default: linux
      arch:
        description: Target architecture
        required: false
        type: string
        default: amd64

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    name: Sign ${{ inputs.name }}
    runs-on: self-hosted
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sign
        uses: ./.github/actions/sign
        with:
          name: ${{ inputs.name }}
          os: ${{ inputs.os }}
          arch: ${{ inputs.arch }}
