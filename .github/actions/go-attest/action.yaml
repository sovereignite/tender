name: 'Go Attest'
description: 'Attest build provenance for Go binary'
inputs:
  binary-name:
    description: 'Binary filename'
    required: true
  target-id:
    description: 'Stable logical target id used in artifact names'
    required: true
runs:
  using: "composite"
  steps:
    - name: "Download binary"
      uses: actions/download-artifact@v7
      with:
        name: binary-${{ inputs.target-id }}
        path: ${{ runner.temp }}/binary-${{ inputs.target-id }}/

    - name: "Attest build provenance"
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: ${{ runner.temp }}/binary-${{ inputs.target-id }}/${{ inputs.binary-name }}
