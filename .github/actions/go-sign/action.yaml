name: 'Go Sign'
description: 'Sign Go binary with cosign'
inputs:
  binary-name:
    description: 'Binary filename'
    required: true
  target-id:
    description: 'Stable logical target id used in artifact names'
    required: true
runs:
  using: "composite"
  steps:
    - name: "Download binary"
      uses: actions/download-artifact@v7
      with:
        name: binary-${{ inputs.target-id }}
        path: ${{ runner.temp }}/binary-${{ inputs.target-id }}/

    - name: "Install cosign"
      uses: sigstore/cosign-installer@v4.1.0

    - name: "Sign binary"
      run: |
        BINARY="${{ runner.temp }}/binary-${{ inputs.target-id }}/${{ inputs.binary-name }}"
        cosign sign-blob --yes --bundle "${BINARY}.sigstore.json" "${BINARY}"
      shell: bash

    - name: "Upload signature"
      uses: actions/upload-artifact@v7
      with:
        name: binary-signature-${{ inputs.target-id }}
        path: ${{ runner.temp }}/binary-${{ inputs.target-id }}/*.sigstore.json
        retention-days: 1
