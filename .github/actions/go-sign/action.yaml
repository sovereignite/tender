name: 'Go Sign'
description: 'Sign Go binary with cosign'
inputs:
  target-id:
    description: 'Stable logical target id used in artifact names'
    required: true
runs:
  using: "composite"
  steps:
    - name: "Download binary"
      uses: actions/download-artifact@v7
      with:
        name: binary-${{ inputs.target-id }}
        path: /tmp/binary/

    - name: "Install cosign"
      uses: sigstore/cosign-installer@v4.1.0

    - name: "Sign binary"
      run: |
        BINARY=$(ls /tmp/binary/*)
        cosign sign-blob --yes --output-signature "${BINARY}.sig" "${BINARY}"
      shell: bash

    - name: "Upload signature"
      uses: actions/upload-artifact@v7
      with:
        name: binary-sig-${{ inputs.target-id }}
        path: /tmp/binary/*.sig
        retention-days: 1
