name: Sign
description: Sign a command with Cosign
inputs:
  name:
    description: Command name
    required: true
  os:
    description: Target operating system
    required: false
    default: linux
  arch:
    description: Target architecture
    required: false
    default: amd64
runs:
  using: "composite"
  steps:
    - name: Download build
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/${{ inputs.name }}/

    - name: Install Cosign
      uses: sigstore/cosign-installer@v4.1.0

    - name: Sign
      run: |
        file="${{ inputs.name }}-${{ inputs.os }}-${{ inputs.arch }}"
        root="${{ runner.temp }}/${{ inputs.name }}"
        cosign sign-blob --yes --bundle "$root/$file.sigstore.json" "$root/$file"
      shell: bash

    - name: Upload signed build
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/${{ inputs.name }}/
        overwrite: true
        retention-days: 7
