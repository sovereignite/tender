name: Discover commands
description: 'Find all Go commands in cmd/*'
inputs:
  files:
    description: 'Newline-delimited changed file paths'
    required: false
  all:
    description: 'Whether all targets are required'
    required: false
    default: 'false'
outputs:
  commands:
    description: 'List of Go command names'
    value: ${{ steps.commands.outputs.commands }}
  found:
    description: 'Whether any Go commands are affected'
    value: ${{ steps.commands.outputs.found }}
runs:
  using: "composite"
  steps:
    - name: Discover commands
      id: commands
      env:
        CHANGED_FILES: ${{ inputs.files }}
        FULL_BUILD: ${{ inputs.all }}
      run: |
        mapfile -t candidates < <(find cmd -maxdepth 1 -type d -not -name cmd -exec basename {} \; | sort)
        changed="$CHANGED_FILES"
        full_build="$FULL_BUILD"
        if printf '%s\n' "$changed" | awk '/^\.github\// || /^(go\.mod|go\.sum|go\.work|go\.work\.sum)$/ || /^internal\// { found=1 } END { exit !found }'; then
          full_build=true
        fi

        selected=()
        for command in "${candidates[@]}"; do
          if [ "$full_build" = true ] || printf '%s\n' "$changed" | awk -v prefix="cmd/$command/" '$0 ~ "^" prefix { found=1 } END { exit !found }'; then
            selected+=("$command")
          fi
        done

        if [ "${#selected[@]}" -eq 0 ]; then
          echo 'commands=["__skip__"]' >> "$GITHUB_OUTPUT"
          echo 'found=false' >> "$GITHUB_OUTPUT"
        else
          commands=$(printf '%s\n' "${selected[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "commands=$commands" >> "$GITHUB_OUTPUT"
          echo 'found=true' >> "$GITHUB_OUTPUT"
        fi
      shell: bash
