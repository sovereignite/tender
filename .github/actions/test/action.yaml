name: Test
description: Run Go tests with JUnit report
inputs:
  path:
    description: Path to test
    required: true
  module:
    description: 'Path to go.mod for Go version detection'
    required: false
    default: 'go.mod'
  report:
    description: 'Name for the test report artifact'
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ inputs.module }}
        cache: false

    - name: Install gotestsum
      run: go install gotest.tools/gotestsum@v1.13.0
      shell: bash

    - name: Test
      run: gotestsum --junitfile "$RUNNER_TEMP/tests.xml" --format standard-verbose -- -short ${{ inputs.path }}
      shell: bash

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report }}
        path: ${{ runner.temp }}/tests.xml
