name: 'Go Build'
description: 'Cross-compile Go binary and upload as artifact'
inputs:
  import-path:
    description: 'Go import path to build'
    required: true
  binary-name:
    description: 'Output binary name'
    required: true
  target-id:
    description: 'Stable logical target id used in artifact names'
    required: true
  goos:
    description: 'Target GOOS'
    required: false
    default: 'linux'
  goarch:
    description: 'Target GOARCH'
    required: false
    default: 'amd64'
  go-version-file:
    description: 'Path to go.mod for Go version detection'
    required: false
    default: 'go.mod'
outputs:
  binary:
    description: 'Path to the built binary'
    value: ${{ steps.build.outputs.binary }}
  digest:
    description: 'SHA256 digest of the binary'
    value: ${{ steps.build.outputs.digest }}
runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ inputs.go-version-file }}

    - name: "Build"
      id: build
      env:
        GOOS: ${{ inputs.goos }}
        GOARCH: ${{ inputs.goarch }}
        CGO_ENABLED: '0'
      run: |
        mkdir -p dist
        BINARY="${{ inputs.binary-name }}"
        go build -trimpath -ldflags="-s -w" -o "dist/${BINARY}" "./${{ inputs.import-path }}"
        DIGEST=$(sha256sum "dist/${BINARY}" | awk '{print $1}')
        echo "binary=dist/${BINARY}" >> "$GITHUB_OUTPUT"
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: "Upload binary"
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ inputs.target-id }}
        path: dist/${{ inputs.binary-name }}
        retention-days: 1

    - name: "Upload digest"
      run: |
        mkdir -p /tmp/binary-ref
        echo "${{ steps.build.outputs.binary }}" > /tmp/binary-ref/binary
        echo "${{ steps.build.outputs.digest }}" > /tmp/binary-ref/digest
        echo "${{ inputs.binary-name }}" > /tmp/binary-ref/name
      shell: bash

    - name: "Upload binary ref"
      uses: actions/upload-artifact@v7
      with:
        name: binary-ref-${{ inputs.target-id }}
        path: /tmp/binary-ref/
        retention-days: 1
