name: Discover changes
description: 'Compute the changed file set once for matrix discovery'
inputs:
  base:
    description: 'Previous commit for master change detection'
    required: false
  head:
    description: 'Current commit for change detection'
    required: false
  branch:
    description: 'Base branch used for branch-wide change detection'
    required: false
    default: 'master'
  compare:
    description: 'Whether to diff from the base branch merge-base'
    required: false
    default: 'false'
outputs:
  files:
    description: 'Newline-delimited changed file paths'
    value: ${{ steps.changes.outputs.files }}
  all:
    description: 'Whether the changed file set is unavailable and all targets are required'
    value: ${{ steps.changes.outputs.all }}
runs:
  using: 'composite'
  steps:
    - name: Discover changes
      id: changes
      env:
        BASE_SHA: ${{ inputs.base }}
        HEAD_SHA: ${{ inputs.head }}
        BASE_REF: ${{ inputs.branch }}
        USE_BRANCH_BASE: ${{ inputs.compare }}
      run: |
        base_sha="$BASE_SHA"
        full_build=false
        changed=''

        if [ "$USE_BRANCH_BASE" = true ]; then
          if ! git fetch --no-tags origin "$BASE_REF"; then
            full_build=true
          else
            base_sha=$(git merge-base "$HEAD_SHA" "origin/$BASE_REF" || true)
            if [ -z "$base_sha" ]; then
              full_build=true
            fi
          fi
        fi

        if [ "$full_build" = false ] && { [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; }; then
          full_build=true
        fi

        if [ "$full_build" = false ]; then
          changed=$(git diff --name-only "$base_sha" "$HEAD_SHA")
        fi

        {
          echo 'files<<EOF'
          printf '%s\n' "$changed"
          echo EOF
          echo "all=$full_build"
        } >> "$GITHUB_OUTPUT"
      shell: bash
